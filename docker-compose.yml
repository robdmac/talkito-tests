      - PYTHONUNBUFFERED=1
    volumes:
      # Mount the source code for development
      - ../talkito:/app/talkito
      - ../tests-repo:/app/tests-repo
    command: python tests-repo/test_stdin_e2e.py

  pexpect-test:
